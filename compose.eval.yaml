# 평가용 덧붙임 구성: AI 서비스의 OpenAI 호출을 기록 장치(llm-proxy)로 보낸다.
#
#   docker compose -f compose.yaml -f compose.eval.yaml up -d
#
# 기록은 eval/runs/llm_calls.jsonl 에 쌓이고 git에서 제외된다.
# 평소 개발 때는 compose.yaml 만 쓰면 기록 장치 없이 OpenAI에 바로 연결된다.

services:
  llm-proxy:
    image: python:3.12-slim
    command: ["python", "/app/llm_proxy.py"]
    environment:
      LLM_LOG_PATH: /logs/llm_calls.jsonl
    volumes:
      - ./eval/llm_proxy.py:/app/llm_proxy.py:ro
      - ./eval/runs:/logs
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    environment:
      OPENAI_BASE_URL: http://llm-proxy:8080/v1
      # 평가 중에는 별칭 대신 날짜가 붙은 판본으로 고정한다.
      # 근거: 운영 구성(deploy/docker-compose.prod.yml)과 ai/.env는 OPENAI_MODEL=gpt-5-mini로 지정해
      #   작성·대화 모델이 모두 gpt-5-mini다 (cfg.py의 기본값 gpt-5는 운영에서 쓰이지 않음).
      #   2026-11-25 기록 장치 로그에서 gpt-5-mini 요청의 응답 모델이 gpt-5-mini-2025-08-07이었다.
      OPENAI_MODEL: ${EVAL_SERVICE_MODEL:-gpt-5-mini-2025-08-07}
      # 정보 추출 호출의 추론 강도를 바꿔 비교할 때 지정한다. 비우면 서비스 기본값(low).
      #   EVAL_EXTRACT_REASONING_EFFORT=low docker compose -f compose.yaml -f compose.eval.yaml up -d --build ai
      OPENAI_EXTRACT_REASONING_EFFORT: ${EVAL_EXTRACT_REASONING_EFFORT:-}
    depends_on:
      llm-proxy:
        condition: service_healthy
