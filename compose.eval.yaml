# 평가용 덧붙임 구성: AI 서비스의 OpenAI 호출을 기록 장치(llm-proxy)로 보낸다.
#
#   docker compose -f compose.yaml -f compose.eval.yaml up -d
#
# 기록은 eval/runs/llm_calls.jsonl 에 쌓이고 git에서 제외된다.
# 평소 개발 때는 compose.yaml 만 쓰면 기록 장치 없이 OpenAI에 바로 연결된다.

services:
  llm-proxy:
    image: python:3.12-slim
    command: ["python", "/app/llm_proxy.py"]
    environment:
      LLM_LOG_PATH: /logs/llm_calls.jsonl
    volumes:
      - ./eval/llm_proxy.py:/app/llm_proxy.py:ro
      - ./eval/runs:/logs
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    environment:
      OPENAI_BASE_URL: http://llm-proxy:8080/v1
      # 평가에서 쓰는 서비스 모델. 서비스의 기본 모델과 같다 (gpt-6.1-terra, 2026-11-27에 gpt-5-mini에서 옮김).
      # 이 모델은 날짜가 붙은 판본이 없어 별칭으로 쓴다. 결과 문서에는 응답에 적힌 모델 이름과 실행 날짜가 남는다.
      # 옛 모델과 비교할 때 (2026-12-11 종료 전까지):
      #   EVAL_SERVICE_MODEL=gpt-5-mini-2025-08-07 docker compose -f compose.yaml -f compose.eval.yaml up -d ai
      OPENAI_MODEL: ${EVAL_SERVICE_MODEL:-gpt-6.1-terra}
      # 정보 추출 호출의 추론 강도를 바꿔 비교할 때 지정한다. 비우면 서비스 기본값(low).
      #   EVAL_EXTRACT_REASONING_EFFORT=low docker compose -f compose.yaml -f compose.eval.yaml up -d --build ai
      OPENAI_EXTRACT_REASONING_EFFORT: ${EVAL_EXTRACT_REASONING_EFFORT:-}
      # 작업별 모델을 바꿔 비교할 때 지정한다. 비우면 위의 OPENAI_MODEL을 쓴다.
      #   EVAL_LLM_MODEL_EXTRACT=gpt-6-luna docker compose -f compose.yaml -f compose.eval.yaml up -d ai
      LLM_MODEL_EXTRACT: ${EVAL_LLM_MODEL_EXTRACT:-}
      LLM_MODEL_COMPOSE: ${EVAL_LLM_MODEL_COMPOSE:-}
      LLM_MODEL_VERIFY: ${EVAL_LLM_MODEL_VERIFY:-}
      LLM_MODEL_REWRITE: ${EVAL_LLM_MODEL_REWRITE:-}
      LLM_MODEL_RAG_KEYWORD: ${EVAL_LLM_MODEL_RAG_KEYWORD:-}
      LLM_MODEL_RAG_SUMMARY: ${EVAL_LLM_MODEL_RAG_SUMMARY:-}
      # 비우면 서비스 기본값(켜짐): 검증이 찾은 표현을 고치기 전에 사용자 확인을 기다리고, 평가기의 모의 사용자가 답한다.
      # 묻지 않고 고치는 동작과 비교하거나 verify_drafts.py를 쓸 때는 0으로 둔다.
      #   EVAL_DRAFT_CONFIRM=0 docker compose -f compose.yaml -f compose.eval.yaml up -d --build ai
      DRAFT_CONFIRM: ${EVAL_DRAFT_CONFIRM:-}
    depends_on:
      llm-proxy:
        condition: service_healthy
